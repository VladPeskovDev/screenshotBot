<!-- renderer.html -->
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Настройки</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #f0f0f0;
      }
      .title-bar {
        -webkit-app-region: drag;
        height: 28px;
        background: #e0e0e0;
      }
      .title-bar * {
        -webkit-app-region: no-drag;
      }
      h1 {
        text-align: center;
        margin: 15px 0;
      }
      .container {
        padding: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
      }
      input,
      textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      .button {
        display: inline-block;
        background: #007aff;
        color: #fff;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        border: none;
      }
      .button:hover {
        background: #005bbb;
      }
      /* Кнопка выхода */
      .exit-btn {
        background: #ff3b30;
        margin-top: 15px;
      }
      .exit-btn:hover {
        background: #d32f2f;
      }
    </style>
  </head>
  <body>
    <div class="title-bar"></div>

    <h1>Настройки</h1>
    <div class="container">
      <div class="form-group">
        <label for="chatIdInput">Telegram Chat ID:</label>
        <input type="text" id="chatIdInput" placeholder="Введите чат ID" />
      </div>

      <div class="form-group">
        <label for="promptInput">Доп. промпт к аудио:</label>
        <textarea id="promptInput" rows="3" placeholder="Например: 'Переведи это на английский'"></textarea>
      </div>

      <div class="form-group">
        <label for="screenshotPrompt">Доп. промпт к скриншоту:</label>
        <textarea id="screenshotPrompt" rows="3" placeholder="Например: 'Опиши, что изображено'"></textarea>
      </div>

      <div>
        <button id="saveBtn" class="button">Сохранить</button>
      </div>

      <!-- Кнопка выхода -->
      <div>
        <button id="quitBtn" class="button exit-btn">Выход</button>
      </div>

    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
